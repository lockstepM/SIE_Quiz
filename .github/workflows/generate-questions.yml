name: Generate Question Bank

on:
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume from saved progress (if a previous run was interrupted)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Restore progress cache (if resuming)
        if: ${{ github.event.inputs.resume == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: scripts/generate-progress.json
          key: generate-progress-${{ github.run_id }}
          restore-keys: |
            generate-progress-

      - name: Generate 1,500 questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-questions.js

      - name: Save progress on failure
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: scripts/generate-progress.json
          key: generate-progress-${{ github.run_id }}

      - name: Verify output
        run: |
          node -e "
            const fs = require('fs');
            const content = fs.readFileSync('js/questions.js', 'utf8');
            eval(content.replace('const DB', 'var DB'));
            console.log('Total questions:', DB.length);
            const sections = {};
            DB.forEach(q => { sections[q.s] = (sections[q.s] || 0) + 1; });
            Object.entries(sections).forEach(([s, n]) => console.log(s + ':', n));
            const finra = DB.filter(q => q.src === 'finra-public').length;
            const original = DB.filter(q => q.src === 'original').length;
            console.log('FINRA public:', finra, '| Original:', original);
            if (DB.length < 1400) { console.error('Too few questions!'); process.exit(1); }
          "

      - name: Commit generated questions
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add js/questions.js
          git diff --staged --quiet || git commit -m "feat: add 1,500 original SIE practice questions generated by Claude API"
          git push

      - name: Upload questions as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questions-${{ github.run_id }}
          path: js/questions.js
          retention-days: 30
